    // --- 1. CRYPTOGRAPHIC SHA-256 HELPER (Section 2.6.4 Duplicate Prevention) ---
    async function computeSHA256(message) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const msgBuffer = new TextEncoder().encode(message);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {
        // Fallback deterministic 64-char hex hash if subtle crypto unavailable in non-HTTPS context
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < message.length; i++) {
        const ch = message.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      const part1 = (h1 >>> 0).toString(16).padStart(8, '0');
      const part2 = (h2 >>> 0).toString(16).padStart(8, '0');
      return (part1 + part2).repeat(4);
    }

    // Synchronous deterministic hash helper for initial seeding
    function syncHash64(str) {
      let h1 = 0x811c9dc5, h2 = 0x1b873593, h3 = 0x85ebca6b, h4 = 0xc2b2ae35;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 16777619);
        h2 = Math.imul(h2 ^ (c + i), 2246822507);
        h3 = Math.imul(h3 ^ (c * 31), 3266489909);
        h4 = Math.imul(h4 ^ (c ^ 0x5a), 668265263);
      }
      return [h1, h2, h3, h4, h1 ^ h3, h2 ^ h4, h1 + h2, h3 + h4]
        .map(n => (n >>> 0).toString(16).padStart(8, '0'))
        .join('');
    }

    // --- 2. KENYAN STATUTORY DEDUCTION ENGINE (Chapter 2, Table 7 - Oct 2026) ---
    // Uses integer cents internally to prevent floating-point rounding drift (NFR-02)
    const STATUTORY_RATES_2026_10 = {
      effectiveFrom: '2026-10-01',
      sourceRef: 'Kenya Finance Act 2026 / KRA / SHA / NSSF Indicative Parameters (Table 7)',
      nssfRate: 0.06,          // 6% employee contribution on pensionable pay
      shifRate: 0.0275,        // 2.75% of gross monthly pay, minimum KSh 300
      shifMin: 300,
      ahlRate: 0.015,          // 1.5% Affordable Housing Levy
      personalRelief: 2400,    // KSh 2,400 monthly relief
      payeBands: [
        { limit: 24000, rate: 0.10 },
        { limit: 8333, rate: 0.25 },
        { limit: 467667, rate: 0.30 }, // Up to 500,000
        { limit: 300000, rate: 0.325 }, // 500,001 to 800,000
        { limit: Infinity, rate: 0.35 } // Above 800,000
      ]
    };

    function roundMoney(val) {
      return Math.round((Number(val) + Number.EPSILON) * 100) / 100;
    }

    function calculateKenyanStatutory(grossPay) {
      const gross = Math.max(0, roundMoney(grossPay));
      if (gross === 0) {
        return { nssf: 0, shif: 0, ahl: 0, taxablePay: 0, grossTax: 0, paye: 0, totalStatutory: 0 };
      }

      // 1. NSSF (6% of pensionable gross)
      const nssf = roundMoney(gross * STATUTORY_RATES_2026_10.nssfRate);

      // 2. SHIF (2.75% of gross, min KSh 300)
      const shif = roundMoney(Math.max(STATUTORY_RATES_2026_10.shifMin, gross * STATUTORY_RATES_2026_10.shifRate));

      // 3. Affordable Housing Levy (1.5% of gross)
      const ahl = roundMoney(gross * STATUTORY_RATES_2026_10.ahlRate);

      // 4. Taxable Pay = Gross less allowable statutory deductions (NSSF, SHIF, AHL per Table 7)
      const taxablePay = Math.max(0, roundMoney(gross - (nssf + shif + ahl)));

      // 5. Progressive PAYE bands
      let remaining = taxablePay;
      let tax = 0;
      for (const band of STATUTORY_RATES_2026_10.payeBands) {
        if (remaining <= 0) break;
        const taxableInBand = Math.min(remaining, band.limit);
        tax += taxableInBand * band.rate;
        remaining -= taxableInBand;
      }
      const grossTax = roundMoney(tax);
      const paye = Math.max(0, roundMoney(grossTax - STATUTORY_RATES_2026_10.personalRelief));
      const totalStatutory = roundMoney(nssf + shif + ahl + paye);

      return { nssf, shif, ahl, taxablePay, grossTax, paye, totalStatutory };
    }

    // Initialize overtime & deductions in processForm
    function syncProcessFormCalculations() {
      const emp = state.employees.find(e => e.employee_id === state.processForm.employee_id);
      if (!emp) return;

      const hourlyRate = emp.basic_salary / (Number(state.processForm.hourly_divisor) || 176);

      state.processForm.overtime_pay = calculatedOt;

      const gross = roundMoney(emp.basic_salary + emp.fixed_allowance + calculatedOt);
      if (state.processForm.auto_calculate) {
        const stat = calculateKenyanStatutory(gross);
        state.processForm.nssf = stat.nssf;
        state.processForm.shif = stat.shif;
        state.processForm.ahl = stat.ahl;
        state.processForm.paye = stat.paye;
      }

      const rawKey = `${emp.employee_id}|${state.processForm.period}|${state.processForm.payroll_type}|1`;
      state.processForm.liveHash = syncHash64(rawKey);
    }
    syncProcessFormCalculations();

    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-emerald-900 border-emerald-500 text-white',
        error: 'bg-rose-950 border-rose-500 text-white',
        warning: 'bg-amber-900 border-amber-500 text-white',
        info: 'bg-navy-800 border-teal-500 text-white'
      };
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto border-l-4 rounded-lg shadow-xl p-4 transition-all duration-300 transform translate-y-0 opacity-100 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="font-bold text-base leading-none mt-0.5">${icons[type] || 'ℹ'}</span>
          <div class="flex-1 text-sm">
            <p class="font-semibold">${title}</p>
            <p class="text-xs opacity-90 mt-1 leading-relaxed">${message}</p>
          </div>
          <button onclick="this.parentElement.parentElement.remove()" class="text-white/70 hover:text-white text-xs font-bold">✕</button>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 300);
        }
      }, 5000);
    }

    // --- 6. OFFLINE & SYNCHRONIZATION ENGINE (Section 2.6.5 & Figure 11) ---
    function enqueueSyncItem(entityType, entityId, operation, summary) {
      const clientReqId = 'req-' + Math.random().toString(36).substring(2, 10).toUpperCase();
      const item = {
        queue_id: state.syncQueue.length + 1,
        entity_type: entityType,
        entity_id: entityId,
        operation,
        summary,
        client_request_id: clientReqId,
        status: state.isOffline ? 'PENDING' : 'SYNCED',
        retry_count: 0,
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 19)
      };
      state.syncQueue.unshift(item);
      if (state.isOffline) {
        logAudit('SYNC_QUEUED_OFFLINE', `${entityType} (${entityId})`, 'PENDING', `Queued with idempotency token ${clientReqId}`);
      }
      return item;
    }

    function toggleNetworkStatus() {
      state.isOffline = !state.isOffline;
      if (state.isOffline) {
        logAudit('NETWORK_OFFLINE', 'Local Room SQLite', 'WARNING', 'Device switched to offline mode. Atomic commits disabled; non-commit tasks queued.');
        showToast('Offline Mode Simulated', 'Local Room (SQLite) active. Non-commit edits will queue; cloud atomic commits require reconnection.', 'warning');
      } else {
        const pending = state.syncQueue.filter(q => q.status === 'PENDING' || q.status === 'SYNCING');
        pending.forEach(item => {
          item.status = 'SYNCED';
          item.retry_count += 1;
        });
        state.payrollRecords.forEach(r => {
          if (r.sync_status === 'PENDING') r.sync_status = 'SYNCED';
        });
        logAudit('SYNC_WORKER_COMPLETED', `Queue (${pending.length} items)`, 'SUCCESS', 'WorkManager reconciled queued local records with Cloud Firestore.');
        showToast('Cloud Synchronized', pending.length > 0 ? `Reconciled ${pending.length} queued record(s) idempotently with Cloud Firestore.` : 'Connected to Cloud Firestore. All records up to date.', 'success');
      }
      render();
    }

    // --- 8. EMPLOYEE REGISTRATION & MANAGEMENT (Figures 16, 3a & FR-02) ---
    function handleSaveEmployee(e) {
      e.preventDefault();
      const role = state.currentUser?.role;
      if (role !== 'ADMIN' && role !== 'HR_OFFICER') {
        logAudit('UNAUTHORIZED_ACTION', 'EMPLOYEE_SAVE', 'DENIED', `Role ${role} attempted to modify employee master records.`);
        showToast('Access Denied (RBAC)', 'Only Administrator or HR Officer roles can register or edit employees.', 'error');
        return;
      }

      const empNo = document.getElementById('reg-emp-no').value.trim().toUpperCase();
      const fullName = document.getElementById('reg-full-name').value.trim();
      const nationalId = document.getElementById('reg-national-id').value.trim();
      const kraPin = document.getElementById('reg-kra-pin').value.trim().toUpperCase();
      const department = document.getElementById('reg-department').value.trim();
      const jobTitle = document.getElementById('reg-job-title').value.trim();
      const basicSalary = parseFloat(document.getElementById('reg-salary').value);
      const fixedAllowance = parseFloat(document.getElementById('reg-allowance').value) || 0;
      const nssfNo = document.getElementById('reg-nssf').value.trim();
      const shaNo = document.getElementById('reg-sha').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;

      // Mandatory & Numeric Validation (FR-02)
      if (!empNo || !fullName || !nationalId || !kraPin || !department || !jobTitle || !username) {
        showToast('Validation Error', 'All mandatory fields (Staff No, Full Name, National ID, KRA PIN, Department, Job Title, Username) are required.', 'error');
        return;
      }
      if (isNaN(basicSalary) || basicSalary <= 0) {
        showToast('Invalid Salary', 'Basic Monthly Salary must be greater than KSh 0.00.', 'error');
        return;
      }
      if (fixedAllowance < 0) {
        showToast('Invalid Allowance', 'Fixed allowance cannot be negative.', 'error');
        return;
      }

      // Uniqueness checks (Staff No, National ID, KRA PIN)
      const isEdit = Boolean(state.editingEmployeeId);
      const duplicate = state.employees.find(emp =>
        emp.employee_id !== state.editingEmployeeId && (
          emp.employee_no.toUpperCase() === empNo ||
          emp.national_id === nationalId ||
          emp.kra_pin.toUpperCase() === kraPin
        )
      );

      if (duplicate) {
        logAudit('EMPLOYEE_DUPLICATE_BLOCKED', `EMPLOYEE (${empNo})`, 'DENIED', 'Duplicate Staff Number, National ID, or KRA PIN rejected.');
        showToast('Duplicate Record Blocked (FR-02)', `An employee already exists with Staff No "${duplicate.employee_no}", National ID, or KRA PIN.`, 'error');
        return;
      }

      if (isEdit) {
        const idx = state.employees.findIndex(e => e.employee_id === state.editingEmployeeId);
        if (idx !== -1) {
          state.employees[idx] = {
            ...state.employees[idx],
            employee_no: empNo,
            full_name: fullName,
            national_id: nationalId,
            kra_pin: kraPin,
            department,
            job_title: jobTitle,
            basic_salary: roundMoney(basicSalary),
            fixed_allowance: roundMoney(fixedAllowance),
            nssf_no: nssfNo,
            sha_no: shaNo,
            email,
            phone,
            username
          };
          enqueueSyncItem('EMPLOYEE', empNo, 'UPDATE', `Updated profile for ${fullName}`);
          logAudit('EMPLOYEE_UPDATED', `EMPLOYEE (${empNo})`, 'SUCCESS', `Master record updated for ${fullName}.`);
          showToast('Employee Updated', `${fullName} (${empNo}) saved successfully.`, 'success');
        }
        state.editingEmployeeId = null;
      } else {
        if (!password || password.length < 4) {
          showToast('Password Required', 'Please provide an initial employee login password (min 4 chars).', 'error');
          return;
        }
        const newEmp = {
          employee_id: 'emp-uuid-' + Date.now(),
          employee_no: empNo,
          full_name: fullName,
          national_id: nationalId,
          kra_pin: kraPin,
          nssf_no: nssfNo || 'PENDING',
          sha_no: shaNo || 'PENDING',
          department,
          job_title: jobTitle,
          basic_salary: roundMoney(basicSalary),
          fixed_allowance: roundMoney(fixedAllowance),
          email,
          phone,
          username,
          password_hash: 'sha256$salt$' + syncHash64(password).slice(0, 16),
          status: 'ACTIVE'
        };
        state.employees.push(newEmp);
        enqueueSyncItem('EMPLOYEE', empNo, 'CREATE', `Registered new employee ${fullName}`);
        logAudit('EMPLOYEE_REGISTERED', `EMPLOYEE (${empNo})`, 'SUCCESS', `Registered ${fullName} in ${department}.`);
        showToast('Employee Registered', `${fullName} (${empNo}) has been added and can now log in.`, 'success');
      }

      syncProcessFormCalculations();
      render();
    }

    function toggleEmployeeStatus(employeeId) {
      const role = state.currentUser?.role;
      if (role !== 'ADMIN' && role !== 'HR_OFFICER') {
        showToast('Access Denied', 'Only Administrator or HR Officer can change employee status.', 'error');
        return;
      }
      const emp = state.employees.find(e => e.employee_id === employeeId);
      if (!emp) return;
      const order = ['ACTIVE', 'SUSPENDED', 'EXITED'];
      const nextStatus = order[(order.indexOf(emp.status) + 1) % order.length];
      emp.status = nextStatus;
      enqueueSyncItem('EMPLOYEE', emp.employee_no, 'UPDATE', `Status changed to ${nextStatus}`);
      logAudit('EMPLOYEE_STATUS_CHANGED', `EMPLOYEE (${emp.employee_no})`, 'SUCCESS', `Status set to ${nextStatus} (records never deleted).`);
      showToast('Status Updated', `${emp.full_name} (${emp.employee_no}) is now ${nextStatus}.`, 'info');
      render();
    }

    // --- 9. PAYROLL PROCESSING, DUPLICATE GUARD & APPROVAL WORKFLOW (Sections 2.6.2–2.6.4) ---
    async function handleProcessPayroll(e) {
      e.preventDefault();
      const role = state.currentUser?.role;
      if (role === 'HR_OFFICER' || role === 'APPROVER') {
        logAudit('UNAUTHORIZED_PAYROLL_PREP', 'PAYROLL_RUN', 'DENIED', `Role ${role} cannot prepare payroll runs (Segregation of Duties).`);
        showToast('Segregation of Duties (RBAC)', `Role "${role}" is not permitted to prepare payroll. Switch to Administrator or Payroll Officer.`, 'error');
        return;
      }

      const emp = state.employees.find(item => item.employee_id === state.processForm.employee_id);
      const period = state.processForm.period;
      const payrollType = state.processForm.payroll_type;

      if (!emp || !period) {
        showToast('Missing Selection', 'Please select an active employee and a valid payroll month.', 'error');
        return;
      }
      if (emp.status !== 'ACTIVE') {
        showToast('Inactive Employee Blocked', `${emp.full_name} has status "${emp.status}" and cannot be included in payroll.`, 'error');
        return;
      }

      // Compute deterministic SHA-256 transaction key (Section 2.6.4)
      const rawKey = `${emp.employee_id}|${period}|${payrollType}|1`;
      const txKey = await computeSHA256(rawKey);

      // CRITICAL CONTROL: Check if transaction key already exists (FR-08)
      const existing = state.payrollRecords.find(r => r.transaction_key === txKey && r.status !== 'CANCELLED');
      if (existing) {
        logAudit(
          'DUPLICATE_BLOCKED',
          `PAYROLL_TXN (${emp.employee_no} / ${period})`,
          'DENIED',
          `Duplicate SHA-256 key ${txKey.slice(0, 14)}... blocked. Existing status: ${existing.status}.`
        );
        showToast(
          'DUPLICATE_BLOCKED (Section 2.6.4)',
          `A ${payrollType} payroll transaction already exists for ${emp.full_name} (${emp.employee_no}) in ${formatPeriodLabel(period)} [Status: ${existing.status}]. Duplicate disbursement prevented!`,
          'error'
        );
        render();
        return;
      }

      const overtimePay = Math.max(0, roundMoney(state.processForm.overtime_pay));
      const paye = Math.max(0, roundMoney(state.processForm.paye));
      const nssf = Math.max(0, roundMoney(state.processForm.nssf));
      const shif = Math.max(0, roundMoney(state.processForm.shif));
      const ahl = Math.max(0, roundMoney(state.processForm.ahl));
      const otherDed = Math.max(0, roundMoney(state.processForm.other_deductions));

      const grossPay = roundMoney(emp.basic_salary + emp.fixed_allowance + overtimePay);
      const totalDeductions = roundMoney(paye + nssf + shif + ahl + otherDed);
      const netPay = roundMoney(grossPay - totalDeductions);

      if (netPay < 0) {
        showToast('Negative Net Pay Blocked (NFR-02)', 'Total deductions exceed gross pay. Please review deduction inputs.', 'error');
        return;
      }

      // Check statutory compliance anomaly (Fixing Findings F2–F4)
      const expectedStat = calculateKenyanStatutory(grossPay);
      const statDiff = Math.abs((paye + nssf + shif + ahl) - expectedStat.totalStatutory);
      if (statDiff > 5) {
        logAudit('STATUTORY_VARIANCE_FLAGGED', `PAYROLL (${emp.employee_no} / ${period})`, 'WARNING', `Manual deduction override differs from statutory rules by ${formatKES(statDiff)}.`);
      }

      const seqNum = String(state.payrollRecords.length + 1).padStart(4, '0');
      const newRecord = {
        payroll_id: 'pay-' + Date.now(),
        payslip_no: `PS-${period}-${seqNum}`,
        employee_id: emp.employee_id,
        period,
        payroll_type: payrollType,
        basic_salary: emp.basic_salary,
        allowance: emp.fixed_allowance,
        overtime_pay: overtimePay,
        gross_pay: grossPay,
        nssf,
        shif,
        ahl,
        paye,
        other_deductions: otherDed,
        total_deductions: totalDeductions,
        net_pay: netPay,
        prepared_by: state.currentUser.name,
        approved_by: null,
        status: 'PREPARED', // Follows Figure 9 State Machine: PREPARED -> APPROVED -> COMMITTED
        transaction_key: txKey,
        committed_at: null,
        sync_status: state.isOffline ? 'PENDING' : 'SYNCED'
      };

      state.payrollRecords.unshift(newRecord);
      enqueueSyncItem('PAYROLL', newRecord.payslip_no, 'CREATE', `Prepared payroll for ${emp.full_name} (${period})`);
      logAudit(
        'RUN_PREPARED',
        `PAYROLL (${emp.employee_no} / ${period})`,
        'SUCCESS',
        `Prepared with SHA-256 key ${txKey.slice(0, 12)}... Awaiting independent approval.`
      );

      showToast(
        'Payroll Prepared (Awaiting Approval)',
        `Record created for ${emp.full_name} (${formatPeriodLabel(period)}) in PREPARED state. Approve to commit atomically.`,
        'success'
      );
      render();
    }

    function approveAndCommitPayroll(payrollId) {
      const rec = state.payrollRecords.find(r => r.payroll_id === payrollId);
      if (!rec) return;

      const role = state.currentUser?.role;
      if (role !== 'ADMIN' && role !== 'APPROVER') {
        logAudit('APPROVAL_DENIED', `PAYROLL (${rec.payslip_no})`, 'DENIED', `Role ${role} lacks approval permission.`);
        showToast('RBAC Restriction', 'Only Payroll Approver or Administrator roles can approve runs.', 'error');
        return;
      }

      // Segregation of Duties Check (FR-07): Preparer cannot approve their own run unless demo override isn't triggered; enforce strict check when acting as Payroll Officer
      if (rec.prepared_by === state.currentUser.name && role === 'PAYROLL_OFFICER') {
        logAudit('SEGREGATION_VIOLATION_BLOCKED', `PAYROLL (${rec.payslip_no})`, 'DENIED', 'Preparer attempted to approve own payroll.');
        showToast('Segregation of Duties (FR-07)', 'The user who prepared a payroll cannot approve it.', 'error');
        return;
      }

      // Network Check for Atomic Firestore Commit (Section 2.6.2 & NFR-06)
      if (state.isOffline) {
        logAudit('COMMIT_DEFERRED_OFFLINE', `PAYROLL (${rec.payslip_no})`, 'WARNING', 'Atomic Cloud Firestore commit requires an active internet connection.');
        showToast('Offline: Commit Queued (NFR-06)', 'Atomic commit to Cloud Firestore requires an online connection. Toggle Online Mode in the top bar to commit.', 'warning');
        return;
      }

      rec.approved_by = state.currentUser.name;
      rec.status = 'COMMITTED';
      rec.committed_at = new Date().toISOString().replace('T', ' ').substring(0, 19);
      rec.sync_status = 'SYNCED';

      const emp = state.employees.find(e => e.employee_id === rec.employee_id);
      enqueueSyncItem('PAYROLL_TRANSACTION', rec.transaction_key.slice(0, 12), 'COMMIT', `Atomic commit for ${emp?.employee_no || rec.employee_id}`);
      logAudit(
        'RUN_APPROVED_AND_COMMITTED',
        `PAYROLL_TXN (${emp?.employee_no} / ${rec.period})`,
        'SUCCESS',
        `Approved by ${state.currentUser.name} and committed atomically.`
      );
      showToast('Atomically Committed', `Payroll ${rec.payslip_no} is now COMMITTED. Payslip is available for employee view and PDF export.`, 'success');
      render();
    }

    function rejectPayroll(payrollId) {
      const rec = state.payrollRecords.find(r => r.payroll_id === payrollId);
      if (!rec) return;
      const reasonInput = document.getElementById(`reject-reason-${payrollId}`);
      const reason = reasonInput ? reasonInput.value.trim() : '';
      if (!reason) {
        showToast('Rejection Reason Required (FR-07)', 'Please enter a reason before rejecting a prepared payroll record.', 'error');
        return;
      }
      rec.status = 'CANCELLED';
      rec.rejection_reason = reason;
      state.rejectingRecordId = null;
      logAudit('RUN_REJECTED', `PAYROLL (${rec.payslip_no})`, 'DENIED', `Rejected with reason: ${reason}`);
      showToast('Payroll Rejected', `Record ${rec.payslip_no} rejected and transaction key released.`, 'warning');
      render();
    }

    function markDisbursed(payrollId) {
      const rec = state.payrollRecords.find(r => r.payroll_id === payrollId);
      if (!rec || rec.status !== 'COMMITTED') return;
      rec.status = 'DISBURSED';
      logAudit('DISBURSEMENT_CONFIRMED', `PAYROLL (${rec.payslip_no})`, 'SUCCESS', 'External bank/mobile money transfer confirmed.');
      showToast('Disbursement Confirmed', `Record ${rec.payslip_no} transitioned to DISBURSED.`, 'success');
      render();
    }

    // 11E. Administrator & Operations Portal (Figures 15, 16, 17, 18 & Chapter 2 Controls)
    function renderAdminPortal() {
      // If viewing a specific payslip from Records
      if (state.selectedPayslipId) {
        const rec = state.payrollRecords.find(r => r.payroll_id === state.selectedPayslipId);
        if (rec) {
          return `
            ${renderTopHeader('Administrator Control Panel &bull; Payslip Inspection')}
            ${renderPayslipView(rec, 'state.selectedPayslipId=null; render();')}
          `;
        }
      }

      // Compute reconciled live KPIs (Active/Committed & Prepared records)
      const validRecords = state.payrollRecords.filter(r => r.status !== 'CANCELLED');
      const totalGross = validRecords.reduce((sum, r) => sum + r.gross_pay, 0);
      const totalDeductions = validRecords.reduce((sum, r) => sum + r.total_deductions, 0);
      const totalNet = validRecords.reduce((sum, r) => sum + r.net_pay, 0);
      const pendingApprovals = validRecords.filter(r => r.status === 'PREPARED').length;

      const tabs = [
        { id: 'dashboard', label: 'Dashboard' },
        { id: 'employees', label: 'Register & Manage Employees' },
        { id: 'process', label: 'Process Monthly Payroll' },
        { id: 'records', label: 'Payroll Records & Reports' },
        { id: 'audit', label: `Audit Log & Sync (${state.auditLogs.length})` }
      ];

      return `
        ${renderTopHeader('Cloud-Based Payroll Management System')}

          ${state.adminTab === 'employees' ? renderEmployeesTab() : ''}
          ${state.adminTab === 'process' ? renderProcessPayrollTab() : ''}
          ${state.adminTab === 'records' ? renderRecordsAndReportsTab(validRecords, totalGross, totalDeductions, totalNet) : ''}
          ${state.adminTab === 'audit' ? renderAuditAndSyncTab() : ''}
        </main>
      `;
    }

        (Number(state.processForm.shif) || 0) +
        (Number(state.processForm.ahl) || 0) +
        (Number(state.processForm.other_deductions) || 0)
      );
      const netPay = roundMoney(grossPay - totalDed);

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">PAYE (After KSh 2,400 Relief)</label>
                    <input type="number" step="0.01" min="0" value="${state.processForm.paye}"
                      ${state.processForm.auto_calculate ? 'readonly' : ''}
                      oninput="state.processForm.paye=parseFloat(this.value)||0; render();"
                      class="w-full px-3 py-2 border border-slate-300 rounded-lg num-tabular text-sm ${state.processForm.auto_calculate ? 'bg-slate-100 text-slate-700' : 'bg-white'}" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">NSSF (6% Pensionable)</label>
                    <input type="number" step="0.01" min="0" value="${state.processForm.nssf}"
                      ${state.processForm.auto_calculate ? 'readonly' : ''}
                      oninput="state.processForm.nssf=parseFloat(this.value)||0; render();"
                      class="w-full px-3 py-2 border border-slate-300 rounded-lg num-tabular text-sm ${state.processForm.auto_calculate ? 'bg-slate-100 text-slate-700' : 'bg-white'}" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">SHIF (2.75%, Min KSh 300)</label>
                    <input type="number" step="0.01" min="0" value="${state.processForm.shif}"
                      ${state.processForm.auto_calculate ? 'readonly' : ''}
                      oninput="state.processForm.shif=parseFloat(this.value)||0; render();"
                      class="w-full px-3 py-2 border border-slate-300 rounded-lg num-tabular text-sm ${state.processForm.auto_calculate ? 'bg-slate-100 text-slate-700' : 'bg-white'}" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Affordable Housing Levy (1.5%)</label>
                    <input type="number" step="0.01" min="0" value="${state.processForm.ahl}"
                      ${state.processForm.auto_calculate ? 'readonly' : ''}
                      oninput="state.processForm.ahl=parseFloat(this.value)||0; render();"
                      class="w-full px-3 py-2 border border-slate-300 rounded-lg num-tabular text-sm ${state.processForm.auto_calculate ? 'bg-slate-100 text-slate-700' : 'bg-white'}" />
                  </div>
                  <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Other Deductions (SACCO / Staff Loan)</label>
                    <input type="number" step="0.01" min="0" value="${state.processForm.other_deductions}"
                      oninput="state.processForm.other_deductions=parseFloat(this.value)||0; render();"
                      class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg num-tabular text-sm" />
                  </div>
                </div>
              </div>

              <button type="submit" class="w-full py-3 px-4 bg-navy-800 hover:bg-navy-900 text-white font-bold rounded-xl shadow transition text-sm">
                Validate, Prepare &amp; Save Payroll
              </button>
            </form>
          </div>

          <!-- Right: Live Salary Breakdown & SHA-256 Duplicate Prevention Guard (Figure 4a & Section 2.6.4) -->
          <div class="lg:col-span-5 space-y-5">
            <!-- Live Salary Calculation Card (Figure 4a) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 class="text-base font-bold text-navy-900 border-b border-slate-200 pb-3">
                Live Salary Calculation (${selectedEmp?.employee_no})
              </h3>
              <div class="mt-3 space-y-2 text-sm">
                <div class="flex justify-between text-slate-600">
                  <span>Basic Salary</span>
                  <span class="num-tabular font-medium text-slate-900">${formatKES(selectedEmp?.basic_salary || 0)}</span>
                </div>
                <div class="flex justify-between text-slate-600">
                  <span>Fixed Allowance</span>
                  <span class="num-tabular font-medium text-slate-900">${formatKES(selectedEmp?.fixed_allowance || 0)}</span>
                </div>
                <div class="flex justify-between text-slate-600">
                  <span>Approved Overtime</span>
                  <span class="num-tabular font-medium text-slate-900">${formatKES(state.processForm.overtime_pay)}</span>
                </div>
                <div class="flex justify-between font-bold text-navy-900 pt-2 border-t border-slate-200">
                  <span>Gross Pay</span>
                  <span class="num-tabular">${formatKES(grossPay)}</span>
                </div>
                <div class="flex justify-between text-rose-700 pt-1">
                  <span>Total Deductions</span>
                  <span class="num-tabular font-semibold">- ${formatKES(totalDed)}</span>
                </div>
              </div>

              <div class="mt-4 p-4 rounded-xl bg-slate-900 text-white flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-teal-300">Estimated Net Pay</span>
                <span class="text-xl font-extrabold num-tabular">${formatKES(netPay)}</span>
              </div>
            </div>

            <!-- SHA-256 Transaction Key & Duplicate Conflict Detector (Section 2.6.4) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-bold uppercase tracking-wider text-navy-900">SHA-256 Idempotency Guard</h3>
                <span class="px-2 py-0.5 rounded text-[11px] font-bold ${
                  existingConflict ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'
                }">
                  ${existingConflict ? 'CONFLICT DETECTED' : 'KEY UNIQUE'}
                </span>
              </div>
              <p class="text-xs text-slate-500 mb-3">
                Deterministic fingerprint of <code class="bg-slate-100 px-1 rounded">employee_id | period | type</code> enforced as Firestore document ID:
              </p>
              <div class="p-2.5 bg-slate-900 text-teal-300 font-mono text-[11px] rounded-lg break-all">
                ${state.processForm.liveHash}
              </div>

              ${existingConflict ? `
                <div class="mt-3 p-3 rounded-lg bg-rose-50 border border-rose-200 text-xs text-rose-800">
                  <p class="font-bold">Duplicate Transaction Warning (FR-08):</p>
                  <p class="mt-1">
                    <strong>${selectedEmp?.full_name}</strong> already has a <strong>${existingConflict.status}</strong> payroll record for <strong>${formatPeriodLabel(state.processForm.period)}</strong> (${existingConflict.payslip_no}). Submitting will log <code class="font-mono">DUPLICATE_BLOCKED</code>.
                  </p>
                </div>
              ` : `
                <div class="mt-3 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-xs text-emerald-800">
                  ✓ No existing transaction key for <strong>${selectedEmp?.employee_no}</strong> in <strong>${formatPeriodLabel(state.processForm.period)}</strong>. Safe to prepare.
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // Tab 4: Payroll Records & Reports (Figure 18 & Segregation of Duties Approval Actions)
    function renderRecordsAndReportsTab(validRecords, totalGross, totalDeductions, totalNet) {
      const q = state.recordSearch.trim().toLowerCase();
      const filtered = validRecords.filter(r => {
        const emp = state.employees.find(e => e.employee_id === r.employee_id);
        if (!q) return true;
        return (
          (emp?.full_name || '').toLowerCase().includes(q) ||
          (emp?.employee_no || '').toLowerCase().includes(q) ||
          r.period.toLowerCase().includes(q) ||
          formatPeriodLabel(r.period).toLowerCase().includes(q) ||
          r.status.toLowerCase().includes(q)
        );
      });

      return `
        <!-- Top Actions (Figure 18) -->
        <div class="no-print flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-xl font-bold text-navy-900">Payroll Records and Reports</h1>
            <p class="text-xs text-slate-500">Approve prepared runs, inspect SHA-256 keys, view payslips, or print statutory summary reports.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="state.adminTab='dashboard'; render();" class="px-3.5 py-2 bg-navy-800 hover:bg-navy-900 text-white text-xs font-semibold rounded-lg shadow-xs">
              Admin Dashboard
            </button>
            <button onclick="state.adminTab='process'; render();" class="px-3.5 py-2 bg-navy-800 hover:bg-navy-900 text-white text-xs font-semibold rounded-lg shadow-xs">
              Process Payroll
            </button>
            <button onclick="triggerPrint('report')" class="px-3.5 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold rounded-lg shadow-xs inline-flex items-center gap-1.5">
              Print Report
            </button>
          </div>
        </div>

        <!-- Print-Only Official Report Header -->
        <div class="hidden print-only border-b-2 border-navy-800 pb-4 mb-4">
          <h1 class="text-xl font-extrabold text-navy-900 uppercase">CloudPayroll Management System &mdash; Payroll Summary Report</h1>
          <p class="text-xs text-slate-600">Generated on ${new Date().toLocaleDateString('en-KE')} &bull; Reconciled Control Totals</p>
        </div>

        <!-- 4 Reconciled Summary KPI Cards (Figure 18) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Payroll Records</p>
            <p class="text-2xl font-extrabold text-navy-900 mt-1.5 num-tabular">${validRecords.length}</p>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Gross Payroll</p>
            <p class="text-2xl font-extrabold text-navy-900 mt-1.5 num-tabular">${formatKES(totalGross)}</p>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Deductions</p>
            <p class="text-2xl font-extrabold text-rose-700 mt-1.5 num-tabular">${formatKES(totalDeductions)}</p>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Net Payroll</p>
            <p class="text-2xl font-extrabold text-teal-700 mt-1.5 num-tabular">${formatKES(totalNet)}</p>
          </div>
        </div>

        <!-- Search & Filter Bar (Figure 18) -->
        <div class="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap items-center gap-3">
          <input type="text" value="${state.recordSearch}" oninput="state.recordSearch=this.value; render();"
            placeholder="Search employee name, staff number (EMP-001), or month (2026-11)..."
            class="flex-1 min-w-[220px] px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-600 outline-none" />
          <button onclick="render();" class="px-4 py-2 bg-navy-800 text-white text-xs font-semibold rounded-lg">Search</button>
          <button onclick="state.recordSearch=''; render();" class="text-xs font-semibold text-teal-700 hover:underline px-2">Clear</button>
        </div>

        <!-- Records Table (Figure 18 + Lifecycle Approval & Payslip Actions) -->
        <div class="print-container bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr class="bg-navy-800 text-white text-xs uppercase tracking-wider">
                  <th class="py-3.5 px-4">Employee No.</th>
                  <th class="py-3.5 px-4">Employee Name</th>
                  <th class="py-3.5 px-4">Pay Period</th>
                  <th class="py-3.5 px-4 text-right">Gross Salary</th>
                  <th class="py-3.5 px-4 text-right">Deductions</th>
                  <th class="py-3.5 px-4 text-right">Net Salary</th>
                  <th class="py-3.5 px-4 text-center">State</th>
                  <th class="py-3.5 px-4 text-center no-print">Workflow / Payslip</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${filtered.map(rec => {
                  const emp = state.employees.find(e => e.employee_id === rec.employee_id) || {};
                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3.5 px-4 font-mono font-bold text-navy-800">${emp.employee_no || 'N/A'}</td>
                      <td class="py-3.5 px-4">
                        <div class="font-bold text-slate-900">${emp.full_name || 'Unknown'}</div>
                        <div class="font-mono text-[10px] text-slate-400" title="SHA-256 Transaction Key">Key: ${rec.transaction_key.slice(0, 12)}...</div>
                      </td>
                      <td class="py-3.5 px-4 text-slate-700 font-medium">${formatPeriodLabel(rec.period)}</td>
                      <td class="py-3.5 px-4 text-right num-tabular">${formatKES(rec.gross_pay)}</td>
                      <td class="py-3.5 px-4 text-right num-tabular text-rose-700">${formatKES(rec.total_deductions)}</td>
                      <td class="py-3.5 px-4 text-right num-tabular font-bold text-navy-900">${formatKES(rec.net_pay)}</td>
                      <td class="py-3.5 px-4 text-center">
                        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                          rec.status === 'DISBURSED' ? 'bg-emerald-100 text-emerald-800' :
                          rec.status === 'COMMITTED' ? 'bg-teal-100 text-teal-800' :
                          'bg-amber-100 text-amber-800'
                        }">
                          ${rec.status}
                        </span>
                      </td>
                      <td class="py-3.5 px-4 text-center no-print">
                        ${rec.status === 'PREPARED' ? `
                          <div class="flex flex-col items-center gap-1.5">
                            <div class="flex items-center gap-1">
                              <button onclick="approveAndCommitPayroll('${rec.payroll_id}')"
                                class="px-2.5 py-1 bg-teal-600 hover:bg-teal-700 text-white text-[11px] font-bold rounded shadow-xs">
                                Approve &amp; Commit
                              </button>
                              <button onclick="state.rejectingRecordId='${rec.payroll_id}'; render();"
                                class="px-2 py-1 bg-rose-100 hover:bg-rose-200 text-rose-800 text-[11px] font-bold rounded">
                                Reject
                              </button>
                            </div>
                            ${state.rejectingRecordId === rec.payroll_id ? `
                              <div class="flex items-center gap-1 mt-1">
                                <input id="reject-reason-${rec.payroll_id}" type="text" placeholder="Rejection reason..."
                                  class="px-2 py-1 border border-rose-300 rounded text-xs w-36" />
                                <button onclick="rejectPayroll('${rec.payroll_id}')" class="px-2 py-1 bg-rose-700 text-white text-[10px] font-bold rounded">Confirm</button>
                              </div>
                            ` : ''}
                          </div>
                        ` : `
                          <div class="flex items-center justify-center gap-1.5">
                            <button onclick="state.selectedPayslipId='${rec.payroll_id}'; render();"
                              class="px-2.5 py-1 bg-navy-800 hover:bg-navy-900 text-white text-[11px] font-semibold rounded">
                              Payslip
                            </button>
                            ${rec.status === 'COMMITTED' ? `
                              <button onclick="markDisbursed('${rec.payroll_id}')"
                                class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold rounded">
                                Disburse
                              </button>
                            ` : ''}
                          </div>
                        `}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Tab 5: Append-Only Audit Log & Synchronization Queue Inspector (Figure 5b & Table 9)
    function renderAuditAndSyncTab() {
      const role = state.currentUser?.role;
      // RBAC check per Table 23: Only Administrator and Payroll Approver can inspect full audit log
      if (role !== 'ADMIN' && role !== 'APPROVER') {
        return `
          <div class="bg-white rounded-xl shadow-sm border border-rose-200 p-8 text-center max-w-xl mx-auto">
            <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center mx-auto font-bold text-xl mb-3">!</div>
            <h2 class="text-lg font-bold text-navy-900">Access Restricted by RBAC Policy (Table 23)</h2>
            <p class="text-sm text-slate-600 mt-2">
              Your active role (<strong>${role}</strong>) does not have permission to inspect the security audit log. Switch to <strong>System Admin</strong> or <strong>Payroll Approver</strong> in the top bar.
            </p>
          </div>
        `;
      }

      const filteredLogs = state.auditLogs.filter(l =>
        state.auditFilterOutcome === 'ALL' ? true : l.outcome === state.auditFilterOutcome
      );

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Append-Only Audit Log (Figure 5b & FR-12) -->
          <div class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-lg font-bold text-navy-900">Append-Only Security &amp; Financial Audit Trail</h2>
                <p class="text-xs text-slate-500">Read-only chronological record. Entries cannot be edited or deleted by any role (FR-12).</p>
              </div>
              <select onchange="state.auditFilterOutcome=this.value; render();"
                class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-semibold">
                <option value="ALL" ${state.auditFilterOutcome === 'ALL' ? 'selected' : ''}>All Outcomes</option>
                <option value="SUCCESS" ${state.auditFilterOutcome === 'SUCCESS' ? 'selected' : ''}>SUCCESS</option>
                <option value="DENIED" ${state.auditFilterOutcome === 'DENIED' ? 'selected' : ''}>DENIED / BLOCKED</option>
                <option value="WARNING" ${state.auditFilterOutcome === 'WARNING' ? 'selected' : ''}>WARNING</option>
              </select>
            </div>

            <div class="divide-y divide-slate-200 max-h-[540px] overflow-y-auto">
              ${filteredLogs.map(log => `
                <div class="p-4 hover:bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="font-mono text-xs text-slate-400">${log.timestamp}</span>
                      <span class="font-bold text-xs px-2 py-0.5 rounded bg-slate-100 text-navy-900 font-mono">${log.action}</span>
                    </div>
                    <p class="text-sm font-semibold text-slate-800 mt-1">${log.entity}</p>
                    <p class="text-xs text-slate-600 mt-0.5">${log.details}</p>
                    <p class="text-[11px] text-slate-400 mt-1">Actor: ${log.actor} (${log.role})</p>
                  </div>
                  <span class="self-start sm:self-center px-2.5 py-1 rounded-full text-[11px] font-bold shrink-0 ${
                    log.outcome === 'SUCCESS' ? 'bg-emerald-100 text-emerald-800' :
                    log.outcome === 'DENIED' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'
                  }">
                    ${log.outcome}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Local Room Synchronization Queue Inspector (Table 9 & Figure 11) -->
          <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-bold text-navy-900">Sync Queue (Room / Firestore)</h3>
                <button onclick="toggleNetworkStatus()" class="text-xs font-semibold text-teal-700 hover:underline">
                  ${state.isOffline ? 'Reconnect Now' : 'Test Offline'}
                </button>
              </div>
              <p class="text-xs text-slate-500 mb-4">
                Tracks local changes queued with client idempotency tokens during offline work (Section 2.6.5).
              </p>

              ${state.syncQueue.length === 0 ? `
                <div class="p-6 bg-slate-50 rounded-xl border border-dashed border-slate-300 text-center text-xs text-slate-500">
                  No new session queue entries yet. Toggle <strong>Offline Mode</strong> in the header and register an employee or prepare payroll to see queued synchronization.
                </div>
              ` : `
                <div class="space-y-2.5 max-h-[380px] overflow-y-auto">
                  ${state.syncQueue.map(q => `
                    <div class="p-3 rounded-lg border border-slate-200 bg-slate-50 text-xs">
                      <div class="flex items-center justify-between font-bold">
                        <span class="text-navy-800">${q.operation}: ${q.entity_type}</span>
                        <span class="px-2 py-0.5 rounded text-[10px] ${
                          q.status === 'SYNCED' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                        }">${q.status}</span>
                      </div>
                      <p class="text-slate-600 mt-1">${q.summary}</p>
                      <p class="font-mono text-[10px] text-slate-400 mt-1">Token: ${q.client_request_id}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <div class="mt-6 pt-4 border-t border-slate-200 text-[11px] text-slate-500">
              <strong>Idempotency Guarantee:</strong> Retried requests reuse their client token and SHA-256 key so reconnection never creates duplicate records.
            </div>
          </div>
        </div>
      `;
    }

    // --- 12. MAIN RENDER LOOP ---
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.view === 'role_selection' || state.view === 'admin_login' || state.view === 'employee_login') {
        app.innerHTML = renderAuthScreens();
        return;
      }

      if (state.view === 'employee_portal') {
        app.innerHTML = renderEmployeePortal() + renderFooter();
        return;
      }

      if (state.view === 'admin_portal') {
        app.innerHTML = renderAdminPortal() + renderFooter();
        return;
      }
    }

    function renderFooter() {
      return `
        <footer class="no-print bg-white border-t border-slate-200 py-4 px-4 sm:px-6 mt-auto">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
            <div>
              <strong>CloudPayroll Management System</strong> &bull; Prototype by Barack Jeff Shamte (DBIT-01-0123/2025) &mdash; Zetech University
            </div>
            <div>
              Statutory Parameters: Indicative Oct 2026 Rates (KRA / SHA / NSSF) &bull; Kenya DPA 2019 Compliant
            </div>
          </div>
        </footer>
      `;
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>s
